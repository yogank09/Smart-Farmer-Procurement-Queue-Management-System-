# Load environment variables from the .env file in the backend root
spring.config.import=optional:file:./.env[.properties]

spring.application.name=smart-farmer-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_farmer_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Browser authentication uses an HttpOnly cookie. Enable Secure outside local HTTP development.
app.auth-cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth-cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.nominatim.contact=${NOMINATIM_CONTACT:}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


logging.level.org.springframework.security=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE